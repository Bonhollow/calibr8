[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "calibr8"
version = "1.0.0"
description = "Confidence Calibration Detector — classifies text as OVERCLAIMING / UNDERCLAIMING / CALIBRATED"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mlx-lm>=0.31",
]

[tool.setuptools.packages.find]
include = ["calibr8*"]
